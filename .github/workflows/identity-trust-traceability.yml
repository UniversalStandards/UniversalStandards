name: Identity trust traceability

on:
  pull_request:
    paths:
      - 'manifests/IDENTITY_TRUST_CONTROLS.json'
      - 'standards/IDENTITY_TRUST.md'
      - 'standards/identity-trust/**'
      - 'scripts/validate-identity-trust.mjs'
      - '.github/workflows/identity-trust-traceability.yml'
  push:
    branches: [main]
    paths:
      - 'manifests/IDENTITY_TRUST_CONTROLS.json'
      - 'standards/IDENTITY_TRUST.md'
      - 'standards/identity-trust/**'
      - 'scripts/validate-identity-trust.mjs'
      - '.github/workflows/identity-trust-traceability.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Validate permanent control IDs and traceability contract
        run: node scripts/validate-identity-trust.mjs
